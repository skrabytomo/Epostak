[EP24]
; Base URL sandboxu epostak.sk (SAPI-SK)
BaseURL=https://dev.epostak.sk/sapi/v1

; POZOR - zmena vyznamu: predtym API token, teraz VASE Peppol Participant Id.
; Pouzite jedno z dvoch demo ID nizsie podla toho, ci prave testujete
; odosielanie alebo prijimanie:
;   0245:0000000001  = Firma A (odosielatel)
;   0245:0000000002  = Firma B (prijimatel)
Token=0245:0000000001

; Voliteľné prepisanie credentials (prazdne = pouzije sa demo Firma A/B
; podla Token, viz EpostakDemoCreds.pas). Pre produkciu / vlastnu firmu
; vyplnte oboje.
ClientId=
ClientSecret=

; Voliteľné prepisanie protistrany pri odosielani (prazdne = automaticke
; sparovanie Firma A <-> Firma B v sandboxe).
ReceiverParticipantId=

SaveFolder=C:\Program Files\Ep24Sender\inbox
